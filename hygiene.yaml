# hygiene.yaml — declared, drift-validated hygiene posture for homebrew-tap.
# Schema reference: the `hygiene` skill (~/.claude/skills/hygiene/SKILL.md).
# Validate with `/hygiene`; aggregate the fleet with `/hygiene fleet`.
#
# This repo is a generated Homebrew tap (Formula/*.rb + README table), not an
# application. Homebrew Releaser commits formula bumps from N source repos.
# Floors are honest about that: no in-repo CI, no LICENSE, no test runner.

schema_version: 1

repo: homebrew-tap
aspires: 3
floors:            # per-dimension held-tier ratchet; below floor => DRIFT
  correctness: 0   # no Actions; formula `test do` blocks never run
  security: 2      # GitHub secret scanning + push protection hold
  quality: 0       # brew style not in CI and currently fails on the live tap
  deps: 1          # bottle sha256 pins in every formula
  release: 1       # formula_renames.json; tap is a sink, not a versioned product
  governance: 0    # README yes; LICENSE and .gitignore missing
  build: 0         # no compile / no CI in this repo
  docs: 1          # README with generated project table
  perf: 0          # a bottle tap has no in-repo benchmarks
  vcs: 0           # no committed hooks; master unprotected
  agent: 0         # no AGENTS.md / CLAUDE.md / bullseye.yaml

tiers:
  1: baseline    # LICENSE + README + .gitignore; tests build & run
  2: maintained  # full matrix, lint/format, release + governance
  3: hardened    # security scanning beyond GitHub defaults, SBOM, fuzzing, perf

items:

  # ============================== CORRECTNESS =============================
  - id: correctness.formula-syntax
    dim: correctness
    desc: Every Formula/*.rb parses under ruby -c
    state: present
    cadence: continuous
    enforce: warning
    tier: 1
    evidence:
      command: >-
        for f in Formula/*.rb; do ruby -c "$f" >/dev/null || exit 1; done

  - id: correctness.ci-audit
    dim: correctness
    desc: CI runs brew audit --online and brew fetch on the tap
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 1
    reason: >-
      No GitHub Actions (workflows total_count 0). Formula tests and
      brew audit --online never run; ged bottle URLs 404 undetected.
    evidence: {absent: {ci_job: ci.yml#audit}}

  - id: correctness.formula-tests
    dim: correctness
    desc: Formula test do blocks run via brew test in CI
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 2
    reason: Every formula has a test do block; nothing invokes brew test.
    evidence: {absent: {ci_job: ci.yml#test}}

  # =========================== SECURITY / SUPPLY ==========================
  - id: security.secret-scan
    dim: security
    desc: GitHub secret scanning enabled on the repo
    state: enforced
    cadence: continuous
    enforce: blocking
    tier: 2
    evidence:
      gh_setting:
        key: security_and_analysis.secret_scanning.status
        equals: enabled

  - id: security.push-protection
    dim: security
    desc: Secret-scanning push protection enabled
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence:
      gh_setting:
        key: security_and_analysis.secret_scanning_push_protection.status
        equals: enabled

  - id: security.gitleaks
    dim: security
    desc: Secret scanning (gitleaks) in pre-commit and/or CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 3
    reason: GitHub native scanning holds; no gitleaks config or CI job.
    evidence: {absent: {scanner: {tool: gitleaks}}}

  - id: security.sast
    dim: security
    desc: Static application security testing (CodeQL)
    state: skipped
    cadence: continuous
    enforce: informational
    tier: 3
    reason: >-
      Generated Homebrew DSL plus prebuilt bottles; no application
      source in this tree. CodeQL would not add a useful signal.
    evidence: {absent: {ci_job: ci.yml#codeql}}

  - id: security.dependabot
    dim: security
    desc: Dependabot security updates enabled
    state: planned
    cadence: periodic:30d
    enforce: informational
    tier: 3
    reason: Dependabot security updates are disabled; tap has no lockfile.
    evidence:
      absent:
        gh_setting:
          key: security_and_analysis.dependabot_security_updates.status
          equals: enabled

  - id: security.actions-perms
    dim: security
    desc: GitHub Actions default token permissions scoped to least privilege
    state: skipped
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No workflows exist to permission.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: permissions}}}

  # ============================== CODE QUALITY ============================
  - id: quality.brew-style
    dim: quality
    desc: brew style --tap marcelocantos/tap is clean in CI
    state: planned
    cadence: continuous
    enforce: warning
    tier: 2
    reason: >-
      brew style is not wired to CI and currently reports offenses
      (component order, line length) on generated formulae.
    evidence: {absent: {ci_step: {workflow: ci.yml, name: brew style}}}

  # =========================== DEPENDENCY HEALTH ==========================
  - id: deps.bottle-sha
    dim: deps
    desc: Every formula pins bottle/source archives with sha256
    state: present
    cadence: per-release
    enforce: warning
    tier: 1
    evidence:
      command: >-
        for f in Formula/*.rb; do grep -q sha256 "$f" || exit 1; done

  - id: deps.freshness
    dim: deps
    desc: Formula versions reviewed against upstream latest tags
    state: manual
    cadence: per-release
    enforce: informational
    tier: 2
    evidence: {manual: {last_verified: 2026-08-22}}

  # ========================== RELEASE & VERSIONING =======================
  - id: release.formula-renames
    dim: release
    desc: formula_renames.json records tern→pigeon
    state: present
    cadence: once-must-hold
    enforce: warning
    tier: 1
    evidence: {file: {path: formula_renames.json, matches: 'pigeon'}}

  - id: release.all-generated
    dim: release
    desc: Every Formula/*.rb is generated by Homebrew Releaser (no snowflakes)
    state: planned
    cadence: per-release
    enforce: warning
    tier: 2
    reason: Formula/ged.rb is hand-rolled and outside the Releaser refresh loop.
    evidence:
      absent:
        command: >-
          test -z "$(grep -L 'generated by Homebrew Releaser' Formula/*.rb)"

  - id: release.changelog
    dim: release
    desc: A maintained CHANGELOG records user-visible tap changes
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      The tap is not independently versioned; history lives in git and
      per-formula version pins. No CHANGELOG.md.
    evidence: {absent: {file: {path: CHANGELOG.md}}}

  - id: release.ci-built
    dim: release
    desc: Bottles are built by this repo's CI
    state: skipped
    cadence: per-release
    enforce: informational
    tier: 3
    reason: >-
      Bottles are built and uploaded by each source repo's release
      workflow; this tap only records URLs and SHAs.
    evidence: {absent: {ci_job: release.yml#build}}

  # ============================ GOVERNANCE / META ========================
  - id: governance.readme
    dim: governance
    desc: README present with install instructions and formula table
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md, matches: 'project_table_start'}}

  - id: governance.license
    dim: governance
    desc: Root LICENSE present (formulae claim Apache-2.0; GitHub licenseInfo is null)
    state: planned
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    reason: No root LICENSE; GitHub reports licenseInfo null.
    evidence: {absent: {file: {path: LICENSE}}}

  - id: governance.gitignore
    dim: governance
    desc: .gitignore covers OS/IDE/agent state
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 1
    reason: No .gitignore; the tree is Formula/*.rb plus README.
    evidence: {absent: {file: {path: .gitignore}}}

  - id: governance.squash-only
    dim: governance
    desc: Repo is squash-merge only
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: allow_merge_commit, equals: false}}

  - id: governance.delete-branch
    dim: governance
    desc: Delete-branch-on-merge is enabled
    state: enforced
    cadence: once-must-hold
    enforce: blocking
    tier: 2
    evidence: {gh_setting: {key: delete_branch_on_merge, equals: true}}

  - id: governance.formula-license-dsl
    dim: governance
    desc: Every formula declares license in the DSL
    state: planned
    cadence: per-release
    enforce: warning
    tier: 3
    reason: Formula/rustuml.rb omits license (upstream is Apache-2.0).
    evidence:
      absent:
        file: {path: Formula/rustuml.rb, matches: 'license '}

  - id: governance.security-md
    dim: governance
    desc: SECURITY.md documents the vulnerability-disclosure process
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: Public repo without a published disclosure policy.
    evidence: {absent: {file: {path: SECURITY.md}}}

  # ================================= BUILD ===============================
  - id: build.ci
    dim: build
    desc: CI builds or audits the tap on every push
    state: planned
    cadence: continuous
    enforce: blocking
    tier: 2
    reason: No .github/workflows; Releaser pushes formula bumps straight to master.
    evidence: {absent: {ci_job: ci.yml#build}}

  # ============================ DOCUMENTATION ============================
  - id: docs.readme
    dim: docs
    desc: README documents brew install marcelocantos/tap/<formula>
    state: present
    cadence: once-must-hold
    enforce: blocking
    tier: 1
    evidence: {file: {path: README.md, matches: 'brew install marcelocantos/tap'}}

  - id: docs.agents-md
    dim: docs
    desc: AGENTS.md records tap conventions (generated vs hand-rolled)
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No AGENTS.md / CLAUDE.md; conventions live only in formula banners.
    evidence: {absent: {file: {path: AGENTS.md}}}

  - id: docs.bullseye
    dim: docs
    desc: bullseye.yaml is the intent ledger for followable work
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No bullseye.yaml; followable work is not declared in-repo.
    evidence: {absent: {file: {path: bullseye.yaml}}}

  # ============================== PERFORMANCE ===========================
  - id: perf.benchmarks
    dim: perf
    desc: Benchmark suite for formula install / bottle fetch
    state: planned
    cadence: per-release
    enforce: informational
    tier: 3
    reason: A generated bottle tap has no in-repo benchmark suite.
    evidence: {absent: {file: {path: benches}}}

  # ============================== VCS / HISTORY =========================
  - id: vcs.branch-protection
    dim: vcs
    desc: Default branch is protected (required checks / no force-push)
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 2
    reason: Branch protection 404; rulesets empty; Releaser pushes directly to master.
    evidence:
      absent:
        command: gh api repos/marcelocantos/homebrew-tap/branches/master/protection --silent

  - id: vcs.pre-commit-hook
    dim: vcs
    desc: Committed git hooks (scripts/hooks) gate locally before commit
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 3
    reason: No scripts/hooks; core.hooksPath is the default .git/hooks.
    evidence: {absent: {file: {path: scripts/hooks/pre-commit}}}

  # =================== AGENT-READINESS / ONBOARDING ====================
  - id: agent.claude-md
    dim: agent
    desc: CLAUDE.md present (conventions discoverable by agents)
    state: planned
    cadence: once-must-hold
    enforce: warning
    tier: 1
    reason: No CLAUDE.md or AGENTS.md.
    evidence: {absent: {file: {path: CLAUDE.md}}}

  - id: agent.bullseye
    dim: agent
    desc: bullseye.yaml present (convergence targets discoverable)
    state: planned
    cadence: once-must-hold
    enforce: informational
    tier: 2
    reason: No bullseye.yaml.
    evidence: {absent: {file: {path: bullseye.yaml}}}
