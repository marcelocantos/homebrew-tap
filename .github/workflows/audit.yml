name: audit

# The tap ships prebuilt bottles, so Homebrew has no compile fallback: a URL
# that stops resolving is a hard `brew install` failure. Homebrew Releaser
# pushes formula bumps straight to master, so this is the only gate they meet.
# The schedule matters as much as the push trigger — a release deleted upstream
# breaks a formula that nobody touched.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: formulae parse and every URL resolves
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check

  style:
    name: brew style (advisory)
    runs-on: macos-latest
    # Formulae are generated by Homebrew Releaser from the source repos;
    # offences must be fixed in those generators, not by editing this tap.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: make style
